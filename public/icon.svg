<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f14"/>
      <stop offset="100%" stop-color="#16161d"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#1ed760"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1ed760" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Glowing Soundwave Bars & Radio Pulse -->
  <g transform="translate(256, 256)" filter="url(#neon-glow)">
    <!-- Central Sound Waves -->
    <rect x="-140" y="-45" width="28" height="90" rx="14" fill="url(#primary-grad)"/>
    <rect x="-85" y="-95" width="28" height="190" rx="14" fill="url(#primary-grad)"/>
    <rect x="-30" y="-140" width="28" height="280" rx="14" fill="url(#primary-grad)"/>
    <rect x="25" y="-110" width="28" height="220" rx="14" fill="url(#primary-grad)"/>
    <rect x="80" y="-70" width="28" height="140" rx="14" fill="url(#primary-grad)"/>
    <rect x="135" y="-35" width="28" height="70" rx="14" fill="url(#primary-grad)"/>

    <!-- Radio center pulse dot -->
    <circle cx="-16" cy="0" r="10" fill="#ffffff"/>
  </g>
</svg>
